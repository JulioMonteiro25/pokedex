<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Pokédex</title>
<style>
  :root {
    --bg: #f3f1ee; --surface: #ffffff; --surface-2: #ece9e4; --text: #1d1c1a; --muted: #6a665f;
    --border: #dedad3; --accent: #e3350d; --accent-ink: #ffffff; --shadow: 0 6px 24px rgba(30,20,10,.10);
    --radius: 16px;
    --sans: system-ui, -apple-system, "Segoe UI", Roboto, Arial, sans-serif;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #141417; --surface: #1e1e23; --surface-2: #29292f; --text: #f1f0ed; --muted: #a09d97;
      --border: #34343b; --accent: #ff5a38; --shadow: 0 6px 24px rgba(0,0,0,.45);
    }
  }
  :root[data-theme="dark"] {
    --bg: #141417; --surface: #1e1e23; --surface-2: #29292f; --text: #f1f0ed; --muted: #a09d97;
    --border: #34343b; --accent: #ff5a38; --shadow: 0 6px 24px rgba(0,0,0,.45);
  }
  /* cores por tipo */
  .t-normal{--tc:#9a9a8a}.t-fire{--tc:#f2762f}.t-water{--tc:#4d8ff0}.t-electric{--tc:#f5c518}
  .t-grass{--tc:#58b84a}.t-ice{--tc:#6fcfd0}.t-fighting{--tc:#c23a2e}.t-poison{--tc:#a652b8}
  .t-ground{--tc:#d4a950}.t-flying{--tc:#8e9ff0}.t-psychic{--tc:#f2528a}.t-bug{--tc:#a2b21c}
  .t-rock{--tc:#b59a35}.t-ghost{--tc:#6b5b9a}.t-dragon{--tc:#6a3af2}.t-dark{--tc:#6b5547}
  .t-steel{--tc:#a3a3bd}.t-fairy{--tc:#ef8fc3}.t-stellar{--tc:#5ac8b0}.t-unknown{--tc:#6a9a90}

  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text); font-family: var(--sans); line-height: 1.5; }
  button { font: inherit; color: inherit; cursor: pointer; }
  .wrap { max-width: 1100px; margin: 0 auto; padding: 0 16px 60px; }

  header.top {
    background: var(--accent); color: var(--accent-ink); padding: 22px 0 70px; position: relative; overflow: hidden;
  }
  header.top::after {
    content: ""; position: absolute; right: -60px; top: -60px; width: 240px; height: 240px; border-radius: 50%;
    background: radial-gradient(circle, #fff 0 22%, rgba(0,0,0,.18) 23% 27%, rgba(255,255,255,.12) 28% 100%);
    opacity: .35; pointer-events: none;
  }
  .bar { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
  .logo { display: flex; align-items: center; gap: 12px; font-weight: 800; font-size: 1.6rem; letter-spacing: -.02em; }
  .logo i { width: 34px; height: 34px; border-radius: 50%; background: #fff; border: 4px solid rgba(0,0,0,.75); position: relative; display: inline-block; }
  .logo i::after { content: ""; position: absolute; inset: 7px; border-radius: 50%; background: #3aa0ff; }
  .icon-btn { background: rgba(255,255,255,.2); border: 0; width: 40px; height: 40px; border-radius: 50%; color: #fff; font-size: 1.1rem; }
  .icon-btn:hover { background: rgba(255,255,255,.32); }

  .search-card {
    background: var(--surface); border-radius: var(--radius); box-shadow: var(--shadow);
    margin-top: -48px; padding: 14px; position: relative; z-index: 2; border: 1px solid var(--border);
  }
  .search-row { display: flex; gap: 10px; position: relative; }
  .search-row input {
    flex: 1; min-width: 0; font: inherit; font-size: 1.05rem; padding: 13px 16px; border-radius: 12px;
    border: 2px solid var(--border); background: var(--surface-2); color: var(--text); outline: none;
  }
  .search-row input:focus { border-color: var(--accent); }
  .rand { background: var(--accent); color: var(--accent-ink); border: 0; border-radius: 12px; padding: 0 18px; font-weight: 700; white-space: nowrap; }
  .rand:hover { filter: brightness(1.08); }
  .chips { display: flex; gap: 8px; overflow-x: auto; padding: 12px 2px 4px; scrollbar-width: thin; }
  .chip {
    flex: none; border: 2px solid var(--border); background: var(--surface); padding: 5px 13px; border-radius: 999px;
    font-size: .85rem; font-weight: 600; text-transform: capitalize;
  }
  .chip:hover { border-color: var(--tc, var(--accent)); }
  .chip.on { background: var(--tc, var(--accent)); border-color: var(--tc, var(--accent)); color: #fff; text-shadow: 0 1px 2px rgba(0,0,0,.35); }

  .meta { display: flex; justify-content: space-between; align-items: center; margin: 22px 2px 12px; color: var(--muted); font-size: .92rem; }
  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(165px, 1fr)); gap: 14px; }
  .card {
    background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); padding: 12px 12px 14px;
    text-align: center; position: relative; overflow: hidden; transition: transform .15s, box-shadow .15s;
  }
  .card:hover, .card:focus-visible { transform: translateY(-4px); box-shadow: var(--shadow); outline: none; }
  .card .num { position: absolute; top: 10px; left: 12px; font-size: .78rem; color: var(--muted); font-weight: 700; }
  .card .art { width: 100%; aspect-ratio: 1; display: grid; place-items: center; background: radial-gradient(circle at 50% 55%, var(--surface-2) 0 60%, transparent 61%); }
  .card img { width: 86%; height: 86%; object-fit: contain; filter: drop-shadow(0 6px 6px rgba(0,0,0,.18)); }
  .card h3 { margin: 6px 0 0; font-size: 1rem; text-transform: capitalize; }
  .skeleton { background: linear-gradient(90deg, var(--surface-2), var(--surface), var(--surface-2)); background-size: 200% 100%; animation: sh 1.2s infinite; border-radius: var(--radius); min-height: 210px; }
  @keyframes sh { to { background-position: -200% 0; } }
  .more { display: block; margin: 26px auto 0; padding: 12px 28px; border-radius: 999px; border: 2px solid var(--accent); background: transparent; color: var(--accent); font-weight: 700; }
  .more:hover { background: var(--accent); color: var(--accent-ink); }
  .empty, .err { text-align: center; color: var(--muted); padding: 50px 10px; grid-column: 1 / -1; }
  .err button { margin-top: 10px; padding: 8px 18px; border-radius: 8px; border: 1px solid var(--border); background: var(--surface); }

  /* detalhes */
  .overlay { position: fixed; inset: 0; background: rgba(0,0,0,.55); display: none; z-index: 50; overflow-y: auto; padding: 24px 12px; }
  .overlay.open { display: block; }
  .sheet { max-width: 860px; margin: 0 auto; background: var(--surface); border-radius: 22px; overflow: hidden; position: relative; box-shadow: 0 20px 60px rgba(0,0,0,.4); }
  .hero {
    background: linear-gradient(160deg, var(--tc, #888), color-mix(in srgb, var(--tc2, var(--tc, #888)) 70%, #000));
    color: #fff; padding: 22px 22px 0; text-shadow: 0 1px 3px rgba(0,0,0,.3); position: relative;
  }
  .close { position: absolute; top: 14px; right: 14px; width: 38px; height: 38px; border: 0; border-radius: 50%; background: rgba(0,0,0,.25); color: #fff; font-size: 1.2rem; z-index: 3; }
  .nav { position: absolute; top: 14px; left: 14px; display: flex; gap: 6px; z-index: 3; }
  .nav button { width: 38px; height: 38px; border: 0; border-radius: 50%; background: rgba(0,0,0,.25); color: #fff; font-size: 1.1rem; }
  .nav button:disabled { opacity: .35; cursor: default; }
  .hero .titles { text-align: center; padding-top: 34px; }
  .hero .id { font-weight: 700; opacity: .85; }
  .hero h2 { margin: 0; font-size: 2.2rem; text-transform: capitalize; line-height: 1.15; }
  .hero .genus { opacity: .9; font-size: .95rem; }
  .types { display: flex; gap: 8px; justify-content: center; margin: 10px 0; flex-wrap: wrap; }
  .type { background: var(--tc); color: #fff; padding: 3px 14px; border-radius: 999px; font-weight: 700; font-size: .85rem; border: 2px solid rgba(255,255,255,.55); text-shadow: 0 1px 2px rgba(0,0,0,.35); }
  .hero .stage { display: grid; place-items: center; position: relative; padding-bottom: 0; }
  .hero .stage img { width: min(300px, 72vw); height: min(300px, 72vw); object-fit: contain; filter: drop-shadow(0 14px 14px rgba(0,0,0,.35)); margin-bottom: -26px; position: relative; z-index: 1; }
  .shiny-btn { position: absolute; right: 0; bottom: 34px; z-index: 2; border: 2px solid rgba(255,255,255,.6); background: rgba(0,0,0,.25); color: #fff; border-radius: 999px; padding: 5px 12px; font-size: .8rem; font-weight: 700; }
  .shiny-btn.on { background: #f5c518; color: #3a2d00; border-color: #fff; text-shadow: none; }
  .body { padding: 44px 22px 26px; display: grid; gap: 26px; }
  .body h4 { margin: 0 0 10px; font-size: .8rem; letter-spacing: .09em; text-transform: uppercase; color: var(--muted); }
  .desc { font-size: 1.02rem; margin: 0; }
  .facts { display: grid; grid-template-columns: repeat(auto-fit, minmax(130px, 1fr)); gap: 10px; }
  .fact { background: var(--surface-2); border-radius: 12px; padding: 10px 14px; }
  .fact b { display: block; font-size: 1.15rem; }
  .fact span { color: var(--muted); font-size: .8rem; }
  .abil { display: flex; gap: 8px; flex-wrap: wrap; }
  .abil span { background: var(--surface-2); padding: 5px 12px; border-radius: 999px; font-size: .88rem; text-transform: capitalize; }
  .abil span.hid { border: 1px dashed var(--muted); }
  .two { display: grid; grid-template-columns: 1fr 1fr; gap: 26px; }
  .stat { display: grid; grid-template-columns: 86px 38px 1fr; align-items: center; gap: 8px; font-size: .9rem; margin: 6px 0; }
  .stat .k { color: var(--muted); }
  .stat .v { font-weight: 700; text-align: right; }
  .track { height: 9px; background: var(--surface-2); border-radius: 99px; overflow: hidden; }
  .fill { height: 100%; border-radius: 99px; background: var(--tc, var(--accent)); width: 0; transition: width .7s cubic-bezier(.2,.8,.2,1); }
  .total { text-align: right; color: var(--muted); font-size: .85rem; margin-top: 4px; }
  .evo-tree { display: flex; align-items: center; gap: 6px; overflow-x: auto; padding: 4px 2px 8px; }
  .evo-node { display: flex; align-items: center; gap: 6px; }
  .branches { display: flex; flex-direction: column; gap: 10px; }
  .branch { display: flex; align-items: center; gap: 6px; }
  .arrow { display: flex; flex-direction: column; align-items: center; color: var(--muted); font-size: .72rem; text-align: center; min-width: 64px; max-width: 90px; line-height: 1.2; }
  .arrow b { font-size: 1.3rem; color: var(--accent); }
  .evo { background: var(--surface-2); border: 2px solid transparent; border-radius: 16px; padding: 8px 10px; text-align: center; width: 118px; }
  .evo:hover { border-color: var(--accent); }
  .evo.cur { border-color: var(--accent); background: var(--surface); }
  .evo img { width: 92px; height: 92px; object-fit: contain; }
  .evo div { font-size: .85rem; font-weight: 700; text-transform: capitalize; }
  .evo small { color: var(--muted); }
  .noevo { color: var(--muted); font-size: .92rem; margin: 0; }
  .varieties { display: flex; gap: 8px; flex-wrap: wrap; }
  .varieties button { border: 1px solid var(--border); background: var(--surface-2); border-radius: 999px; padding: 4px 12px; font-size: .82rem; text-transform: capitalize; }
  .varieties button.on { background: var(--accent); color: #fff; border-color: var(--accent); }
  .loading-sheet { padding: 80px 20px; text-align: center; color: var(--muted); }

  @media (max-width: 640px) {
    .two { grid-template-columns: 1fr; }
    .overlay { padding: 0; }
    .sheet { border-radius: 0; min-height: 100%; }
    .hero h2 { font-size: 1.8rem; }
    .evo-tree, .evo-node, .branch { flex-direction: column; }
    .branches { align-items: center; }
    .arrow b { transform: rotate(90deg); }
    .evo-tree { overflow-x: visible; }
  }
  @media (prefers-reduced-motion: reduce) { * { animation: none !important; transition: none !important; } }
</style>
</head>
<body>
<header class="top">
  <div class="wrap bar">
    <div class="logo"><i></i> Pokédex</div>
    <button class="icon-btn" id="themeBtn" title="Alternar tema" aria-label="Alternar tema">◐</button>
  </div>
</header>

<div class="wrap">
  <div class="search-card">
    <div class="search-row">
      <input id="q" type="search" placeholder="Busque por nome ou número (ex.: pikachu, 25)" autocomplete="off" aria-label="Buscar Pokémon">
      <button class="rand" id="rand" type="button">🎲 Aleatório</button>
    </div>
    <div class="chips" id="chips" aria-label="Filtrar por tipo"></div>
  </div>

  <div class="meta"><span id="count"></span><span>Dados: PokéAPI</span></div>
  <div class="grid" id="grid"></div>
  <button class="more" id="more" type="button" hidden>Carregar mais</button>
</div>

<div class="overlay" id="overlay" role="dialog" aria-modal="true" aria-label="Detalhes do Pokémon">
  <div class="sheet" id="sheet"></div>
</div>

<script>
(function () {
  var API = 'https://pokeapi.co/api/v2/';
  var ART = 'https://raw.githubusercontent.com/PokeAPI/sprites/master/sprites/pokemon/other/official-artwork/';
  var SPR = 'https://raw.githubusercontent.com/PokeAPI/sprites/master/sprites/pokemon/';
  var PAGE = 36, MAX = 1025;
  var TYPE_PT = { normal:'Normal', fire:'Fogo', water:'Água', electric:'Elétrico', grass:'Planta', ice:'Gelo', fighting:'Lutador', poison:'Veneno', ground:'Terra', flying:'Voador', psychic:'Psíquico', bug:'Inseto', rock:'Pedra', ghost:'Fantasma', dragon:'Dragão', dark:'Sombrio', steel:'Aço', fairy:'Fada' };
  var STAT_PT = { hp:'PS', attack:'Ataque', defense:'Defesa', 'special-attack':'Atq. Esp.', 'special-defense':'Def. Esp.', speed:'Velocidade' };

  var cache = {};
  var all = [];          // {id, name}
  var typeFilter = null; // Set de ids ou null
  var current = [];      // lista filtrada
  var shown = 0;
  var navList = [];
  var $ = function (id) { return document.getElementById(id); };

  function get(url) {
    if (!cache[url]) {
      cache[url] = fetch(url).then(function (r) {
        if (!r.ok) throw new Error('HTTP ' + r.status);
        return r.json();
      }).catch(function (e) { delete cache[url]; throw e; });
    }
    return cache[url];
  }
  function idFromUrl(u) { var m = u.match(/\/(\d+)\/?$/); return m ? +m[1] : 0; }
  function pretty(s) { return String(s).replace(/-/g, ' '); }
  function pad(n) { return '#' + String(n).padStart(4, '0'); }
  function img(id, alt) {
    return '<img loading="lazy" alt="' + alt + '" src="' + ART + id + '.png" onerror="this.onerror=null;this.src=\'' + SPR + id + '.png\'">';
  }
  function esc(s) { return String(s).replace(/[&<>"]/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]; }); }

  /* ---------- lista / grade ---------- */
  function init() {
    var grid = $('grid');
    grid.innerHTML = Array(12).fill('<div class="skeleton"></div>').join('');
    Promise.all([get(API + 'pokemon?limit=' + MAX + '&offset=0'), get(API + 'type')]).then(function (res) {
      all = res[0].results.map(function (p) { return { id: idFromUrl(p.url), name: p.name }; });
      var types = res[1].results.map(function (t) { return t.name; }).filter(function (n) { return TYPE_PT[n]; });
      var chips = $('chips');
      chips.innerHTML = '<button class="chip on" data-type="">Todos</button>' + types.map(function (t) {
        return '<button class="chip t-' + t + '" data-type="' + t + '">' + TYPE_PT[t] + '</button>';
      }).join('');
      applyFilters();
      route();
    }).catch(function () {
      grid.innerHTML = '<div class="err">Não foi possível carregar a Pokédex. Verifique sua conexão.<br><button id="retry">Tentar de novo</button></div>';
      $('retry').onclick = init;
    });
  }

  function applyFilters() {
    var q = $('q').value.trim().toLowerCase().replace(/^#/, '');
    current = all.filter(function (p) {
      if (typeFilter && !typeFilter.has(p.id)) return false;
      if (!q) return true;
      return p.name.indexOf(q) !== -1 || String(p.id) === q || pad(p.id).slice(1).replace(/^0+/, '') === q;
    });
    shown = 0;
    $('grid').innerHTML = '';
    renderMore();
  }
  function renderMore() {
    var grid = $('grid');
    var slice = current.slice(shown, shown + PAGE);
    var html = slice.map(function (p) {
      return '<button class="card" data-id="' + p.id + '" aria-label="' + esc(p.name) + '"><span class="num">' + pad(p.id) + '</span><div class="art">' + img(p.id, esc(p.name)) + '</div><h3>' + esc(pretty(p.name)) + '</h3></button>';
    }).join('');
    grid.insertAdjacentHTML('beforeend', html);
    shown += slice.length;
    $('more').hidden = shown >= current.length;
    $('count').textContent = current.length + (current.length === 1 ? ' Pokémon' : ' Pokémon') + ' encontrados';
    if (!current.length) grid.innerHTML = '<div class="empty">Nenhum Pokémon encontrado 😕<br>Tente outro nome ou número.</div>';
  }

  var timer;
  $('q').addEventListener('input', function () { clearTimeout(timer); timer = setTimeout(applyFilters, 180); });
  $('q').addEventListener('keydown', function (e) {
    if (e.key === 'Enter') {
      clearTimeout(timer); applyFilters();
      if (current.length) { navList = current.map(function (p) { return p.id; }); openPokemon(current[0].id); }
    }
  });
  $('more').onclick = renderMore;
  $('grid').addEventListener('click', function (e) {
    var c = e.target.closest('.card'); if (c) { navList = current.map(function (p) { return p.id; }); openPokemon(+c.dataset.id); }
  });
  $('chips').addEventListener('click', function (e) {
    var b = e.target.closest('.chip'); if (!b) return;
    document.querySelectorAll('.chip').forEach(function (x) { x.classList.toggle('on', x === b); });
    var t = b.dataset.type;
    if (!t) { typeFilter = null; applyFilters(); return; }
    $('count').textContent = 'Carregando…';
    get(API + 'type/' + t).then(function (d) {
      typeFilter = new Set(d.pokemon.map(function (x) { return idFromUrl(x.pokemon.url); }).filter(function (i) { return i <= MAX; }));
      applyFilters();
    }).catch(function () { $('count').textContent = 'Erro ao filtrar por tipo.'; });
  });
  $('rand').onclick = function () { navList = []; openPokemon(1 + Math.floor(Math.random() * MAX)); };

  /* ---------- detalhes ---------- */
  var openId = null, shiny = false;
  function openPokemon(id, noHash) {
    openId = id; shiny = false;
    $('overlay').classList.add('open');
    document.body.style.overflow = 'hidden';
    $('overlay').scrollTop = 0;
    $('sheet').innerHTML = '<div class="loading-sheet">Carregando…</div>';
    if (!noHash) history.replaceState(null, '', '#' + id);
    get(API + 'pokemon/' + id).then(function (p) {
      return get(p.species.url).catch(function () { return null; }).then(function (sp) {
        if (openId !== id) return;
        openId = p.id;
        return buildSheet(p, sp);
      });
    }).catch(function () {
      $('sheet').innerHTML = '<button class="close" id="x">✕</button><div class="loading-sheet">Erro ao carregar este Pokémon.</div>';
      $('x').onclick = closeSheet;
    });
  }
  function closeSheet() {
    $('overlay').classList.remove('open'); document.body.style.overflow = ''; openId = null;
    history.replaceState(null, '', location.pathname + location.search);
  }

  function flavor(species) {
    if (!species) return '';
    var pick = function (lang) { return species.flavor_text_entries.filter(function (f) { return f.language.name === lang; }).pop(); };
    var f = pick('en');
    return f ? f.flavor_text.replace(/[\n\f\r]+/g, ' ') : '';
  }
  function genus(species) {
    if (!species) return '';
    var g = species.genera.filter(function (x) { return x.language.name === 'en'; })[0];
    return g ? g.genus : '';
  }

  function buildSheet(p, species) {
    var types = p.types.map(function (t) { return t.type.name; });
    var art = (p.sprites.other && p.sprites.other['official-artwork']) || {};
    var normal = art.front_default || p.sprites.front_default;
    var shinyImg = art.front_shiny || p.sprites.front_shiny;
    var idx = navList.indexOf(p.id);
    var stats = p.stats.map(function (s) {
      var pct = Math.min(100, Math.round(s.base_stat / 180 * 100));
      return '<div class="stat"><span class="k">' + (STAT_PT[s.stat.name] || s.stat.name) + '</span><span class="v">' + s.base_stat + '</span><div class="track"><div class="fill" data-w="' + pct + '"></div></div></div>';
    }).join('');
    var total = p.stats.reduce(function (a, s) { return a + s.base_stat; }, 0);
    var abil = p.abilities.map(function (a) {
      return '<span class="' + (a.is_hidden ? 'hid' : '') + '">' + esc(pretty(a.ability.name)) + (a.is_hidden ? ' (oculta)' : '') + '</span>';
    }).join('');
    var varieties = '';
    if (species && species.varieties && species.varieties.length > 1) {
      varieties = '<div><h4>Formas</h4><div class="varieties">' + species.varieties.map(function (v) {
        return '<button data-name="' + esc(v.pokemon.name) + '" class="' + (v.pokemon.name === p.name ? 'on' : '') + '">' + esc(pretty(v.pokemon.name)) + '</button>';
      }).join('') + '</div></div>';
    }

    $('sheet').innerHTML =
      '<div class="hero t-' + types[0] + (types[1] ? '" style="--tc2:var(--tcb)' : '') + '" id="hero">' +
        '<div class="nav"><button id="prev" aria-label="Anterior"' + (p.id <= 1 ? ' disabled' : '') + '>‹</button><button id="next" aria-label="Próximo"' + (p.id >= MAX ? ' disabled' : '') + '>›</button></div>' +
        '<button class="close" id="x" aria-label="Fechar">✕</button>' +
        '<div class="titles"><div class="id">' + pad(p.id) + '</div><h2>' + esc(pretty(species ? species.name : p.name)) + '</h2><div class="genus">' + esc(genus(species)) + '</div>' +
        '<div class="types">' + types.map(function (t) { return '<span class="type t-' + t + '">' + (TYPE_PT[t] || t) + '</span>'; }).join('') + '</div></div>' +
        '<div class="stage"><img id="hero-img" alt="' + esc(p.name) + '" src="' + normal + '">' +
          (shinyImg ? '<button class="shiny-btn" id="shiny" type="button">✨ Shiny</button>' : '') + '</div>' +
      '</div>' +
      '<div class="body">' +
        (flavor(species) ? '<p class="desc">' + esc(flavor(species)) + '</p>' : '') +
        '<div class="facts"><div class="fact"><b>' + (p.height / 10).toFixed(1).replace('.', ',') + ' m</b><span>Altura</span></div>' +
        '<div class="fact"><b>' + (p.weight / 10).toFixed(1).replace('.', ',') + ' kg</b><span>Peso</span></div>' +
        '<div class="fact"><b>' + p.base_experience + '</b><span>XP base</span></div></div>' +
        '<div class="two"><div><h4>Status base</h4>' + stats + '<div class="total">Total: ' + total + '</div></div>' +
        '<div><h4>Habilidades</h4><div class="abil">' + abil + '</div></div></div>' +
        varieties +
        '<div><h4>Evoluções</h4><div id="evo"><p class="noevo">Carregando evoluções…</p></div></div>' +
      '</div>';

    var hero = $('hero');
    if (types[1]) hero.style.setProperty('--tcb', getComputedStyle(document.querySelector('.type.t-' + types[1])).getPropertyValue('--tc'));
    hero.style.setProperty('--tc', getComputedStyle(document.querySelector('.type.t-' + types[0])).getPropertyValue('--tc'));
    document.querySelector('.body').style.setProperty('--tc', getComputedStyle(hero).getPropertyValue('--tc'));
    requestAnimationFrame(function () { requestAnimationFrame(function () {
      document.querySelectorAll('.fill').forEach(function (f) { f.style.width = f.dataset.w + '%'; });
    }); });

    $('x').onclick = closeSheet;
    if (idx > 0 || idx < navList.length - 1) {
      $('prev').disabled = false; $('next').disabled = false;
    }
    $('prev').onclick = function () { openPokemon(neighbor(p.id, -1)); };
    $('next').onclick = function () { openPokemon(neighbor(p.id, 1)); };
    var sb = $('shiny');
    if (sb) sb.onclick = function () {
      shiny = !shiny; sb.classList.toggle('on', shiny);
      $('hero-img').src = shiny ? shinyImg : normal;
    };
    document.querySelectorAll('.varieties button').forEach(function (b) {
      b.onclick = function () { navList = []; openPokemonByName(b.dataset.name); };
    });
    loadEvolutions(p, species);
  }

  function neighbor(id, dir) {
    var i = navList.indexOf(id);
    if (i !== -1 && navList[i + dir]) return navList[i + dir];
    var n = id + dir; return n < 1 ? MAX : n > MAX ? 1 : n;
  }
  function openPokemonByName(name) { openPokemon(name, false); }

  function loadEvolutions(p, species) {
    var box = $('evo');
    if (!species || !species.evolution_chain) { box.innerHTML = '<p class="noevo">Sem dados de evolução.</p>'; return; }
    var myId = p.id;
    get(species.evolution_chain.url).then(function (c) {
      if (openId !== myId) return;
      if (!c.chain.evolves_to.length) { box.innerHTML = '<p class="noevo">Este Pokémon não evolui nem tem pré-evolução.</p>'; return; }
      box.innerHTML = '<div class="evo-tree">' + renderNode(c.chain, null, species.id) + '</div>';
    }).catch(function () { box.innerHTML = '<p class="noevo">Não foi possível carregar as evoluções.</p>'; });
  }

  function renderNode(node, how, curId) {
    var id = idFromUrl(node.species.url);
    var card = '<button class="evo' + (id === curId ? ' cur' : '') + '" data-open="' + id + '">' + img(id, esc(node.species.name)) + '<div>' + esc(pretty(node.species.name)) + '</div><small>' + pad(id) + '</small></button>';
    var out = '<div class="evo-node">' + card;
    if (node.evolves_to.length) {
      out += '<div class="branches">' + node.evolves_to.map(function (n) {
        return '<div class="branch"><div class="arrow"><b>→</b><span>' + esc(evoLabel(n.evolution_details)) + '</span></div>' + renderNode(n, null, curId) + '</div>';
      }).join('') + '</div>';
    }
    return out + '</div>';
  }
  function evoLabel(list) {
    var d = list && list[0]; if (!d) return '';
    var parts = [];
    if (d.min_level) parts.push('Nv. ' + d.min_level);
    if (d.item) parts.push(pretty(d.item.name));
    if (d.held_item) parts.push('segurando ' + pretty(d.held_item.name));
    if (d.trigger && d.trigger.name === 'trade') parts.push('Troca');
    if (d.min_happiness) parts.push('Amizade');
    if (d.min_affection) parts.push('Afeto');
    if (d.known_move) parts.push('golpe ' + pretty(d.known_move.name));
    if (d.time_of_day) parts.push(d.time_of_day === 'day' ? 'de dia' : 'de noite');
    if (d.location) parts.push(pretty(d.location.name));
    if (!parts.length && d.trigger) parts.push(pretty(d.trigger.name));
    return parts.join(' · ');
  }
  $('sheet').addEventListener('click', function (e) {
    var b = e.target.closest('[data-open]'); if (b) { navList = []; openPokemon(+b.dataset.open); }
  });
  $('overlay').addEventListener('click', function (e) { if (e.target === $('overlay')) closeSheet(); });
  document.addEventListener('keydown', function (e) {
    if (!$('overlay').classList.contains('open')) return;
    if (e.key === 'Escape') closeSheet();
    if (e.key === 'ArrowLeft' && openId) openPokemon(neighbor(openId, -1));
    if (e.key === 'ArrowRight' && openId) openPokemon(neighbor(openId, 1));
  });

  /* ---------- rota (#25 ou #pikachu) ---------- */
  function route() {
    var h = decodeURIComponent(location.hash.slice(1)).toLowerCase();
    if (!h) return;
    if (/^\d+$/.test(h)) openPokemon(+h, true);
    else openPokemon(h, true);
  }

  /* ---------- tema ---------- */
  var root = document.documentElement;
  try { var s = localStorage.getItem('pk-theme'); if (s) root.setAttribute('data-theme', s); } catch (e) {}
  $('themeBtn').onclick = function () {
    var cur = root.getAttribute('data-theme') || (matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
    var n = cur === 'dark' ? 'light' : 'dark';
    root.setAttribute('data-theme', n);
    try { localStorage.setItem('pk-theme', n); } catch (e) {}
  };

  init();
})();
</script>
</body>
</html>
